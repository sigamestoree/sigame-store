<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<title>SIGA-ME STORE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    background:url("Fundo.png");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    color:white;
}

.hero{

    min-height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.hero img{
    width:150px;
    margin-bottom:30px;
}

.hero h1{

    font-size:90px;
    font-weight:900;
    letter-spacing:-3px;
    margin-bottom:20px;
}

.hero p{

    font-size:24px;
    max-width:800px;
    line-height:1.6;
    margin-bottom:40px;
    opacity:.95;
}

.acoes{

    display:flex;
    gap:15px;
    flex-wrap:wrap;
    justify-content:center;
}

.botao{

    background:white;
    color:black;
    padding:18px 42px;
    border-radius:999px;
    text-decoration:none;
    font-weight:700;
    transition:.3s;
    display:inline-block;
}

.botao:hover{

    transform:translateY(-5px);
    box-shadow:
    0 15px 40px rgba(255,255,255,.25);
}

.botaoSecundario{

    background:transparent;
    color:white;
    border:1px solid white;
    padding:18px 42px;
    border-radius:999px;
    text-decoration:none;
    font-weight:700;
    transition:.3s;
    display:inline-block;
}

.botaoSecundario:hover{

    background:white;
    color:black;
    transform:translateY(-5px);
}

@media(max-width:768px){
    .hero h1{
        font-size:55px;
    }

    .hero p{
        font-size:18px;
    }

    .acoes{
        flex-direction:column;
    }
}

</style>
</head>
<body>
<section class="hero">

    <img src="Logo.png">
    <h1>SIGA-ME STORE</h1>
    <p>
        Livros, Bíblias e materiais cristãos para fortalecer sua caminhada de fé.
    </p>
    <a href="loja.html" class="botao">
        EXPLORAR COLEÇÃO
    </a>

</section>

<section id="sobre" style="padding:120px 20px;text-align:center;max-width:900px;margin:auto;">
<h2 style="font-size:50px;margin-bottom:30px;">
SOBRE A SIGA-ME STORE
</h2>

<p style="font-size:22px;line-height:1.8;">
Nossa missão é disponibilizar materiais cristãos que edifiquem a fé,
estimulem o conhecimento bíblico e aproximem pessoas de Deus por meio
da leitura e do aprendizado.
</p>

</section>
</body>
</html>
